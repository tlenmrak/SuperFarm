<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Janus Streaming via Spring WS Proxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
        .row { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button { padding: 8px 14px; margin-right: 8px; }
        label { font-weight: 600; }
        select { padding: 6px 10px; }
        /* iPhone 15 frame (approximate) */
        .iphone-15 { position: relative; width: min(88vw, 420px); margin: 0 auto; }
        .iphone-15 .bezel { position: relative; width: 100%;
            /* aspect-ratio of iPhone 15 screen area 1179x2556 */
            aspect-ratio: 1179 / 2556; background: #000; border-radius: 48px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            padding: 14px; box-sizing: border-box; }
        .iphone-15 .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 40%; height: 28px; background: #000; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; z-index: 3; }
        .iphone-15 .screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #000; }
        #remote { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }
        #gestureOverlay { position: absolute; inset: 0; cursor: crosshair; z-index: 2; touch-action: none; }
        .hint { color: #666; font-size: 12px; }
        #log { white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace;
            background:#111; color:#ddd; padding:12px; border-radius:8px; max-height: 40vh; overflow:auto }
    </style>
</head>
<body>
<div class="row">
    <label for="deviceSelect">Устройство:</label>
    <select id="deviceSelect" aria-label="Выбор устройства"></select>
    <button id="refreshDevices">Обновить</button>
    <span id="deviceMeta" class="hint"></span>
</div>
<div class="row">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
</div>

<div class="row">
    <label for="actionSelect">Действие:</label>
    <select id="actionSelect">
        <option value="tap">Tap</option>
        <option value="swipe">Swipe</option>
        <option value="long_press">Long press</option>
    </select>
    <span id="coordsOut" class="hint"></span>
</div>

<div class="row" style="justify-content:center">
    <div class="iphone-15" id="phoneFrame">
        <div class="bezel">
            <div class="notch"></div>
            <div class="screen">
                <video id="remote" autoplay playsinline muted></video>
                <div id="gestureOverlay" title="Клик/свайп по экрану"></div>
            </div>
        </div>
    </div>
    
</div>

<div class="row"><div id="log" aria-live="polite"></div></div>
<script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

<!-- Подключаем только наш модуль (он сам загрузит janus) -->
<script type="module" src="./app.module.js"></script>
</body>
</html>
