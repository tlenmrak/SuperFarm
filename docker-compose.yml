version: "3.9"
services:
  janus:
    image: sucwangsr/janus-webrtc-gateway-docker:latest
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8188:8188"
      # RTP из VideoBuss -> Janus (streaming plugin)
      - "10000-10100:10000-10100/udp"
      # WebRTC Janus -> браузер (PeerConnection)
      - "20000-20100:20000-20100/udp"

    volumes:
      - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg
      - ./janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg
      - ./janus/janus.plugin.streaming.jcfg:/usr/local/etc/janus/janus.plugin.streaming.jcfg
